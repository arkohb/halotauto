[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/cars/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/inventory.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
