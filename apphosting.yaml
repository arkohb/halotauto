# ════════════════════════════════════════════════════════════════════════
#  Firebase App Hosting · HALO 3EL Autotrader (Next.js server on Cloud Run)
#
#  The trading bot, scanner, sweep and global trade lock live IN MEMORY in
#  one Node process. Exactly ONE instance must run at all times:
#    minInstances 1 → the engine never scales to zero (no cold boots
#                     mid-trade, the 2 s feed loop keeps going)
#    maxInstances 1 → never two bots trading the same account
#  The Cloudflare keep-alive worker (cloudflare/keepalive-worker) also
#  ticks /api/health?tick=1 every minute as a second line of defence.
# ════════════════════════════════════════════════════════════════════════

runConfig:
  minInstances: 1
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: npm run build:apphosting
  runCommand: node .next/standalone/server.js

env:
  - variable: NODE_ENV
    value: production
  - variable: DATABASE_PROVIDER
    value: postgresql
    availability: [BUILD, RUNTIME]
  # Commercial mode (login + license gate) — keep ON in production
  - variable: HALO_COMMERCE
    value: "on"
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"

  # ── secrets (Cloud Secret Manager) — create with:
  #   firebase apphosting:secrets:set DATABASE_URL
  #   firebase apphosting:secrets:set HALO_CRON_SECRET
  #   firebase apphosting:secrets:set ANTHROPIC_API_KEY
  #   firebase apphosting:secrets:set METAAPI_TOKEN
  #   firebase apphosting:secrets:set OANDA_PRACTICE_TOKEN
  #   firebase apphosting:secrets:set OANDA_PRACTICE_ACCOUNT
  #   firebase apphosting:secrets:set EXNESS_API_KEY / EXNESS_API_SECRET / EXNESS_GATEWAY_URL / EXNESS_ACCOUNT_ID
  #   firebase apphosting:secrets:set HALO_DATA_KEY
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: HALO_CRON_SECRET
    secret: HALO_CRON_SECRET
    availability: [RUNTIME]
  # Claude — HALO's conversation brain (voice + chat replies, journal insights)
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]
  # MetaApi platform token — MT4/MT5 connectivity (never stored in source)
  - variable: METAAPI_TOKEN
    secret: METAAPI_TOKEN
    availability: [RUNTIME]
  # OANDA practice account — live forex/metals price feed only (no trading)
  - variable: OANDA_PRACTICE_TOKEN
    secret: OANDA_PRACTICE_TOKEN
    availability: [RUNTIME]
  - variable: OANDA_PRACTICE_ACCOUNT
    secret: OANDA_PRACTICE_ACCOUNT
    availability: [RUNTIME]
  # Exness Trader API — live price feed from the trading account (market data only)
  - variable: EXNESS_API_KEY
    secret: EXNESS_API_KEY
    availability: [RUNTIME]
  - variable: EXNESS_API_SECRET
    secret: EXNESS_API_SECRET
    availability: [RUNTIME]
  - variable: EXNESS_GATEWAY_URL
    secret: EXNESS_GATEWAY_URL
    availability: [RUNTIME]
  - variable: EXNESS_ACCOUNT_ID
    secret: EXNESS_ACCOUNT_ID
    availability: [RUNTIME]
  # Encryption key for stored credentials (broker logins, alert tokens, webhook secret)
  - variable: HALO_DATA_KEY
    secret: HALO_DATA_KEY
    availability: [RUNTIME]
